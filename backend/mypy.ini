; Frozen type-check contract (orchestrator, Phase 0 follow-up).
;
; cv2, timm, pytorch_grad_cam, streamlit and grad-cam ship no type stubs, so
; without ignore_missing_imports the gate cannot pass at all. This also covers
; the pre-merge window where `app.inference.torch_engine` (Agent A) and
; `app.db.base` (Agent B) do not yet exist on a given branch.
[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
warn_unused_configs = True
disable_error_code = import-not-found

[mypy-tests.*]
ignore_errors = True
